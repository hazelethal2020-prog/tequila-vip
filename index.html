<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>專屬星象月曆｜Tequila</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Tequila 品牌：深紫底、金色標準色、吊燈光束、紙卡面板、月相酒痕圓弧紋。單一深色主題。 */
:root{
  color-scheme:dark;
  --bg:#2d1932; --surface:#3a2340; --ink:#f5ecd9; --muted:#c4b4c8; --line:#5a4260;
  --gold:#eac063; --paper:#f3f1ec; --plum:#2d1932;
  --new:#eac063; --full:#f3f1ec; --retro:#b8452f; --ingress:#7a5784;
  --mark:"UnifrakturMaguntia","Old English Text MT",serif;
  --body:"GenSenRounded TW","jf-openhuninn-2.0","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:28px 16px 112px;display:flex;flex-direction:column;gap:22px}
p{margin:0}
h1{font-size:28px;margin:4px 0 0;letter-spacing:.04em;font-weight:700;line-height:1.3}
.brand{font-family:var(--mark);color:var(--gold);font-size:34px;line-height:1}
.vip{display:inline-block;vertical-align:middle;margin-left:6px;border:1px solid var(--gold);color:var(--gold);border-radius:4px;font-size:12px;letter-spacing:.14em;padding:0 7px;line-height:1.6}
.sub{color:var(--muted);font-size:14px}
header{display:flex;flex-direction:column;gap:6px}
button,select,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#result:focus{outline:none}
.dark{--ink:#f5ecd9;--muted:#c4b4c8;--line:#5a4260;color:var(--ink)}

/* 紙卡面板：所有區塊共用同一款標題 */
.panel{--ink:#2d1932;--muted:#5f4e64;--line:#d8d1c6;color:var(--ink);position:relative;background:var(--paper);border-radius:16px;padding:34px 20px 22px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px;color-scheme:light}
.panel::before,.panel::after{content:"";position:absolute;top:14px;width:10px;height:10px;border-radius:50%;background:#55505a}
.panel::before{left:16px}.panel::after{right:16px}
.panel :focus-visible{outline-color:var(--plum)}
.panel>h2{margin:0;text-align:center;font-size:22px;font-weight:700;line-height:1.35;text-wrap:balance}
.panel>.sub{text-align:center}

/* 生日與出生資料表單 */
label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);min-width:0}
select,input[type=number],input[type=time],input[type=text]{height:44px;font-size:16px;border:1px solid #b9b0a4;border-radius:8px;background:#fff;color:var(--ink);padding:0 10px;min-width:0;width:100%}
.r3{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.r2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:8px}
input[type=time]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;text-align:left}
input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
.chk{flex-direction:row;align-items:center;gap:10px;font-size:14px;color:var(--ink);cursor:pointer;min-height:44px}
.chk input{width:20px;height:20px;flex:none;accent-color:var(--plum)}
.hint{font-size:12.5px;color:var(--muted)}
.go{align-self:center;height:44px;border:0;border-radius:999px;background:var(--plum);color:var(--gold);font-weight:700;letter-spacing:.06em;padding:0 28px;font-size:15px}
.msg{background:#fff;border-left:4px solid var(--retro);border-radius:6px;padding:8px 12px;font-size:14px}

/* 標籤與圖例 */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:1px 8px;font-size:13px;font-weight:500;line-height:1.55;border:1px solid transparent}
.chip.new{background:var(--new);color:var(--plum);font-weight:700}
.chip.full{background:var(--full);color:var(--plum);border-color:rgba(45,25,50,.35)}
.chip.retro{background:var(--retro);color:#fff}
.chip.ingress{background:var(--ingress);color:#fff}
.chip.ecl{background:transparent;border-color:var(--gold);color:var(--gold)}
.chip.bday{background:var(--gold);color:var(--plum);font-weight:700}
.chip.axis{background:transparent;border-color:var(--line);color:var(--ink)}
.chip.bg{background:transparent;border-color:var(--line);color:var(--ink)}
/* 每月塔羅牌 */
.chip.tarot{background:rgba(234,192,99,.14);border-color:rgba(234,192,99,.55);color:var(--gold)}
.tbox{display:grid;grid-template-columns:104px 1fr;grid-template-rows:auto 1fr;gap:6px 16px;align-items:start;padding:14px 0 16px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.tcard{position:relative;width:104px;aspect-ratio:2/3;border-radius:7px;background:var(--plum);box-shadow:0 4px 12px rgba(45,25,50,.28);overflow:hidden}
.tcard img{display:block;width:100%;height:100%;object-fit:cover}
.tface{position:absolute;inset:5px;border:1px solid var(--gold);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7px 4px 8px;color:var(--gold);text-align:center}
.tface .tnum{font-family:var(--mark);font-size:19px;line-height:1.1}
.tface .tsym{font-size:30px;line-height:1;opacity:.9}
.tface .tzh{font-size:13px;font-weight:700;letter-spacing:.08em;line-height:1.3}
.tcard.rev img,.tcard.rev .tface{transform:rotate(180deg)}
.tinfo{min-width:0}
.tlbl{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.1em}
.tname{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin-top:2px}
.tname b{font-size:21px;line-height:1.35}
.tname .ten{font-size:13.5px;color:var(--muted)}
.tpos{display:inline-block;margin-top:6px;border-radius:4px;padding:0 8px;font-size:13px;font-weight:700;line-height:1.6;background:var(--plum);color:var(--gold)}
.tkind{margin-left:8px;font-size:13px;color:var(--muted)}
.tpos.rv{background:transparent;border:1px solid var(--plum);color:var(--plum)}
.tdesc{grid-column:2;min-width:0}
.tbox>.tcard{grid-row:span 2}
.ttxt{margin-top:10px;font-size:14.5px;max-width:62ch}
.ttxt+.ttxt{margin-top:6px}
.ttxt.empty{text-wrap:balance;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 8px;justify-content:center}
.vkey{text-align:center;font-size:13.5px;color:var(--muted);margin-top:-2px}
.vkey b{color:var(--plum);font-size:15px}

/* 星座卡 */
.hero{align-items:stretch}
.duo{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:10px;justify-content:center}
.duo.one{grid-template-columns:minmax(0,220px)}
.mini{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.mini .lbl{font-size:13px;color:var(--muted)}
.mini .g{font-size:40px;line-height:1.15;color:var(--plum)}
.mini b{display:block;font-size:18px}
.mini .rng{font-size:12.5px;color:var(--muted)}
.hero .how{font-size:14px;color:var(--muted);text-align:left;max-width:58ch;margin:0 auto}
.cusp{background:#fff;border:1px dashed #b9b0a4;border-radius:10px;padding:10px 12px;font-size:14px;text-align:left}
.linkbtn{background:none;border:0;color:var(--plum);text-decoration:underline;text-underline-offset:3px;padding:6px 4px;font-size:14px}
.hero .linkbtn.again{align-self:center;color:var(--muted);min-height:44px;padding:6px 14px}

/* 太陽／上升並列 */
.vl{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:baseline;margin:6px 0}
.vl1{margin:6px 0}
.vtag{font-size:12px;font-weight:700;border:1px solid var(--plum);color:var(--plum);border-radius:4px;padding:0 6px;white-space:nowrap}
.hot{display:inline-block;margin-top:2px;font-style:normal;font-weight:700;color:var(--plum);background:rgba(234,192,99,.35);border-radius:4px;padding:0 6px;font-size:13px}

/* 全年背景 */
.bgrow{display:grid;grid-template-columns:104px 1fr;gap:4px 14px;padding:12px 0;border-top:1px solid var(--line)}
.bgrow:first-of-type{border-top:0}
.bgd>summary{list-style:none;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700;font-size:15px;cursor:pointer}
.bgd>summary::-webkit-details-marker{display:none}
.bgd>summary .c,.bgd[open]>summary .o{display:none}
.bgd[open]>summary .c{display:inline}
.bgd[open]>summary{margin-bottom:6px}
.bgd>summary .ar{font-size:12px}
.bgrow .what{font-weight:700}
.bgrow .note{font-size:14.5px}
.bgrow .note b{font-weight:700}

/* 月份 */
.mlist{display:flex;flex-direction:column;gap:10px}
details.m{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;animation:fadein .45s ease both;animation-delay:calc(var(--i)*35ms)}
details.m.now{border-left:4px solid var(--gold)}
details.m>summary{list-style:none;display:grid;grid-template-columns:62px 1fr 16px;gap:12px;align-items:start;padding:14px;cursor:pointer}
details.m>summary::-webkit-details-marker{display:none}
.ymbox .y{display:block;font-size:12px;color:var(--muted);line-height:1.2}
.ymbox .mo{display:block;font-size:24px;font-weight:700;color:var(--gold);line-height:1.2;font-variant-numeric:tabular-nums}
.ymbox .nowtag{display:inline-block;margin-top:4px;font-size:11.5px;background:var(--gold);color:var(--plum);border-radius:4px;padding:0 6px;font-weight:700}
.hl{display:block;font-weight:500;font-size:14.5px}
.hline{display:flex;gap:8px;align-items:baseline;white-space:nowrap}
.hline b{flex:none;color:var(--gold)}
.hline .hv{min-width:0}
.vt{display:inline-block;white-space:nowrap;margin-right:10px}
.vt:last-child{margin-right:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:8px;transition:transform .2s}
details[open] .chev{transform:rotate(-135deg);margin-top:12px}
.mbody{--ink:#2d1932;--muted:#5f4e64;--line:#d8d1c6;color:var(--ink);background:var(--paper);padding:6px 16px 18px}
.mbody :focus-visible{outline-color:var(--plum)}
.sec{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.1em;margin:16px 0 2px}
.sec:first-child{margin-top:10px}
.ev{display:grid;grid-template-columns:92px 1fr;gap:4px 14px;padding:10px 0;border-top:1px solid var(--line)}
.sec+.ev{border-top:0}
.ev .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13.5px}
.ev .what{font-weight:700}
.ev .note{grid-column:2;max-width:62ch;font-size:14.5px}
.ev .note em{font-style:normal;color:var(--muted)}
.ev .note em.hot{color:var(--plum)}
.ev .note p+p{margin-top:4px}
.calm{font-size:14.5px;padding:8px 0}
.bgline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.bgline .lbl{font-size:13px;color:var(--muted)}

/* 上鎖 */
.lockrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;background:var(--surface);border:1px dashed #6d5273;border-radius:12px;font-weight:500}
.lockrow svg{flex:none;color:var(--gold)}
.lockrow .mo{color:var(--gold);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.lockrow .y{font-size:12px;color:var(--muted);margin-right:6px}
.lockrow .st{margin-left:auto;color:var(--muted);font-size:13px}
.unlock{background:#fff;border:1.5px solid var(--plum);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.unlock .ttl{display:flex;gap:8px;align-items:center;font-weight:700}
.unlock form{display:flex;gap:8px}
.unlock input{flex:1}
.unlock .ubtn{height:44px;padding:0 20px;border:0;border-radius:8px;background:var(--plum);color:var(--gold);font-weight:700}
.unlock .um{font-size:14px}
.unlock .um:empty{display:none}
.unlock .um.ok{color:#1d6b3a;font-weight:700}
.unlock .um.no{color:var(--retro);font-weight:700}
.okline{font-size:14px;font-weight:700;text-align:center;color:#1d6b3a}

/* 彩蛋與頁尾 */
.cheers{position:relative;align-self:center;background:none;border:0;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 16px;text-align:center;font-size:15px;line-height:1.5;letter-spacing:.06em}
.cheers .glasses{width:132px;height:auto;overflow:visible}
.cheers:not(.on) .glasses{animation:sway 4s ease-in-out infinite}
.gl{transform-box:fill-box;transform-origin:50% 100%}
.cheers.on .gl{animation:clink 1.1s cubic-bezier(.3,.7,.3,1)}
.spark{transform-box:fill-box;transform-origin:50% 50%;opacity:0}
.cheers.on .spark{animation:spark .9s .36s ease-out both}
.ding{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-family:var(--mark);font-size:26px;color:var(--gold);opacity:0;pointer-events:none}
.cheers.on .ding{animation:ding 1.1s .34s ease-out both}
.pt{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold);pointer-events:none}
@keyframes sway{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes clink{0%{transform:none}35%{transform:translate(12px,-4px) rotate(14deg)}48%{transform:translate(8px,-2px) rotate(8deg)}60%{transform:translate(12px,-4px) rotate(13deg)}100%{transform:none}}
@keyframes spark{0%{opacity:0;transform:scale(.2)}30%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(1.8) rotate(45deg)}}
@keyframes ding{0%{opacity:0;transform:translate(-50%,6px)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-18px)}}
.sign{text-align:center;font-family:var(--mark);color:var(--gold);font-size:26px}
#ctext{display:block;min-height:3em}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(45,25,50,.94);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dockin{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;gap:10px}
.dbtn{flex:1;min-height:50px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:10px;font-weight:700;font-size:15.5px;letter-spacing:.04em;text-decoration:none;line-height:1.3}
.dbtn.line{background:var(--gold);color:var(--plum)}
.dbtn.ig{border:1.5px solid var(--gold);color:var(--gold);background:transparent}

/* 動態 */
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
body::before{content:"";position:fixed;top:0;left:50%;width:150vw;height:100vh;transform:translateX(-50%);z-index:0;pointer-events:none;
  background:linear-gradient(rgba(234,192,99,.24),rgba(234,192,99,0) 80%);clip-path:polygon(50% 0,100% 100%,0 100%);animation:lamp 5s ease-in-out infinite}
@keyframes lamp{0%,100%{opacity:1}45%{opacity:.82}50%{opacity:.95}55%{opacity:.8}}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{animation:fadein .45s ease both}
.noanim .fade,.noanim details.m{animation:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}#sky{display:none}}

@media (max-width:560px){
  h1{font-size:24px}
  .ev{grid-template-columns:1fr}.ev .note{grid-column:1}
  .bgrow{grid-template-columns:1fr}
  details.m>summary{grid-template-columns:54px 1fr 14px;gap:10px;padding:12px}
  .ymbox .mo{font-size:22px}
  .hl{font-size:13.5px}.hline{gap:6px}.vt{margin-right:7px}
  .tbox{grid-template-columns:86px 1fr;gap:6px 14px}
  .tdesc{grid-column:1/-1}
  .tbox>.tcard{grid-row:auto}
  .tcard{width:86px}
  .tface .tnum{font-size:16px}.tface .tsym{font-size:24px}.tface .tzh{font-size:12px}
  .tname b{font-size:19px}
  .dbtn{font-size:15px}
  .panel{padding:34px 16px 20px}
}

/* v9：太陽／上升卡片 */
.duo2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo2.one{grid-template-columns:minmax(0,240px);justify-content:center}
.m2{position:relative;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 6px 18px rgba(45,25,50,.10);text-align:center}
.m2 .band{position:relative;padding:12px 10px 46px;color:var(--fg);background:var(--bgc)}
.m2 .band::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:22px;background:#fff;border-radius:50% 50% 0 0/100% 100% 0 0}
.m2.sun{--bgc:linear-gradient(160deg,#f3d58a,#e2b04c);--fg:#2d1932;--ac:#b8862b}
.m2.asc{--bgc:linear-gradient(160deg,#4a2c52,#2d1932);--fg:#f5ecd9;--ac:#2d1932}
.m2 .lb{font-size:12px;letter-spacing:.18em;font-weight:700;opacity:.85}
.m2 .lb small{display:block;font-size:10.5px;letter-spacing:.3em;opacity:.7;margin-top:1px}
.m2 .gl{position:relative;z-index:1;width:58px;height:58px;margin:-44px auto 0;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:32px;color:var(--ac);box-shadow:0 0 0 4px #fff,0 0 0 5px color-mix(in srgb,var(--ac) 35%,#fff)}
.m2 .bd{padding:8px 12px 14px}
.m2 .nm{font-size:21px;font-weight:700;line-height:1.3}
.m2 .rg{font-size:12px;color:var(--muted)}
.m2 .meta{margin:10px 0 8px;font-size:13px;font-weight:700;color:var(--ac)}
.m2.asc .meta{color:#6b4a73}
.m2 .kw{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.m2 .kw span{display:inline-block;font-size:11.5px;border-radius:999px;padding:0 6px;line-height:1.7;border:1px solid color-mix(in srgb,var(--ac) 40%,#fff);color:var(--ink)}
.m2 .ds{margin-top:9px;font-size:13px;line-height:1.6;color:var(--muted)}
.read{border-radius:16px;background:#fff;border:1px solid var(--line);overflow:hidden}
.read h3{margin:0;padding:12px 14px 4px;font-size:15.5px;text-align:center}
.read .sub2{text-align:center;font-size:12.5px;color:var(--muted);padding:0 14px 10px}
.read .cols{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.read .col{padding:12px 12px 14px}.read .col+.col{border-left:1px solid var(--line)}
.read .pill{display:inline-block;border-radius:8px;padding:2px 9px;font-size:12.5px;font-weight:700}
.read .pill.sun{background:#eac063;color:#2d1932}.read .pill.asc{background:#2d1932;color:#eac063}
.read .q{margin-top:8px;font-weight:700;font-size:14.5px}
.read .ex{margin-top:4px;font-size:13px;line-height:1.6;color:var(--muted)}
.read .both{padding:12px 14px;background:linear-gradient(90deg,#fbf3df,#f3eef6);border-top:1px solid var(--line);font-size:13.5px;line-height:1.7}
.read .both .pill{background:#2d1932;color:#eac063;box-shadow:inset 0 0 0 1.5px #eac063;font-size:12px;padding:0 7px}
/* v9：彩色卡片（大背景與每月） */
.b2{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden;box-shadow:0 2px 8px rgba(45,25,50,.06);color:#2d1932;--ink:#2d1932;--muted:#5f4e64}
.bglist .b2:first-child{margin-top:4px}
.b2>summary{list-style:none;cursor:pointer}.b2>summary::-webkit-details-marker{display:none}
.b2 .ph{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px;background:color-mix(in srgb,var(--c) 12%,#fff);border-bottom:1px solid color-mix(in srgb,var(--c) 30%,#fff)}
details.b2:not([open]) .ph{border-bottom:0}
.b2 .pg{flex:none;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:18px;line-height:1}
.b2 .pn{font-weight:700;font-size:16px;line-height:1.3}

/* 同步 SHA-256（只處理 ASCII 字串） */
function sha256(s){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const n=s.length,w=new Array(64),words=[];
  for(let i=0;i<n;i++) words[i>>2]|=s.charCodeAt(i)<<(24-(i&3)*8);
  words[n>>2]|=0x80<<(24-(n&3)*8);
  const L=(((n+8)>>6)+1)<<4;
  for(let i=0;i<L;i++) if(words[i]===undefined) words[i]=0;
  words[L-1]=n*8;
  let a0=0x6a09e667,b0=0xbb67ae85,c0=0x3c6ef372,d0=0xa54ff53a,e0=0x510e527f,f0=0x9b05688c,g0=0x1f83d9ab,h0=0x5be0cd19;
  for(let o=0;o<L;o+=16){
    for(let i=0;i<64;i++){
      if(i<16) w[i]=words[o+i]|0;
      else{const x=w[i-15],y=w[i-2];
        w[i]=(w[i-16]+(((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3))+w[i-7]+(((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10)))|0;}
    }
    let a=a0,b=b0,c=c0,d=d0,e=e0,f=f0,g=g0,h=h0;
    for(let i=0;i<64;i++){
      const t1=(h+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&f)^(~e&g))+K[i]+w[i])|0;
      const t2=((((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&b)^(a&c)^(b&c)))|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    a0=(a0+a)|0;b0=(b0+b)|0;c0=(c0+c)|0;d0=(d0+d)|0;e0=(e0+e)|0;f0=(f0+f)|0;g0=(g0+g)|0;h0=(h0+h)|0;
  }
  return [a0,b0,c0,d0,e0,f0,g0,h0].map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
function canon(s){
  let c=String(s).normalize('NFKC').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length===8) c='TQ'+c;           // 允許省略開頭的 TQ-
  return c;
}
function hashCode(c){let h=sha256(SALT+c);for(let i=0;i<ROUNDS;i++)h=sha256(h+c);return h;}
// 回傳到期月份索引；序號不存在回傳 -1
function endOf(s){
  const c=canon(s);
  if(c.length!==10||c.slice(0,2)!=='TQ') return -1;
  const h=hashCode(c),t=TIERS.find(x=>x[0]===h);
  return t?Math.min(t[1],MONTH_COUNT-1):-1;
}

/* ---------- 太陽／上升並列：fn(v)→{key,html}；兩個視角結果相同時合併並標示重點 ---------- */
function vh(ctx,fn){
  const rs=ctx.views.map(v=>({v,...fn(v)}));
  if(rs.length===1) return `<div class="vl1">${rs[0].html}</div>`;
  if(rs.every(r=>String(r.key)===String(rs[0].key)))
    return `<div class="vl"><span class="vtag">☉↑ 太陽＋上升</span><div>${rs[0].html}<br><em class="hot">兩個視角都指向同一個領域，特別值得留意</em></div></div>`;
  return rs.map(r=>`<div class="vl"><span class="vtag">${r.v.icon} ${r.v.label}</span><div>${r.html}</div></div>`).join('');
}

/* 太陽／上升宮位框＋解說；兩個視角同一宮時合併 */
function kvHTML(ctx,sign,fn){
  const rs=ctx.views.map(v=>({v,h:house(sign,v.sign)}));
  const box=(cls,lab,h,t)=>`<div class="kv"><span class="kbox ${cls}"><b>${lab}</b><span>第 ${h} 宮</span></span><p>${t}</p></div>`;
  if(rs.length===2&&rs[0].h===rs[1].h) return box('both','☉↑ 重點',rs[0].h,fn(rs[0].h)+'<em class="hot">✦ 太陽和上升都指向這裡，這段時間特別值得留意。</em>');
  return rs.map(r=>box(r.v.k,r.v.k==='sun'?'☉ 太陽':'↑ 上升',r.h,fn(r.h))).join('');
}
function cardHTML(col,glyph,title,sub,why,inner,extra=''){
  return `<div class="b2${extra}" style="--c:${col}"><div class="ph"><span class="pg" aria-hidden="true">${glyph}</span><div><div class="pn">${title}</div><div class="pk">${sub}</div></div></div><div class="pb">${why?`<p class="why">${why}</p>`:''}${inner}</div></div>`;
}

function moonItem(x,ctx){
  const [k,t,type,s,deg,ecl]=x,nm=SIGN[s][0],isNew=type==='new',ty=isNew?'新月':'滿月';
  const sol=!!ecl&&ecl.includes('日'),pen=!!ecl&&ecl.includes('半影');
  let why=WHYM[type];
  if(isNew) why+=sol?`這次同時是${ecl}，能量較強烈，不少占星師建議以沉澱與觀察為主，願望可以留到下一次新月再許。`:`請在 ${t} 之後動筆，48 小時內寫完，一次 10 個以內。`;
  else if(pen) why+='這次是半影月食，力道較輕，當作加強版的滿月釋放就好。';
  else if(ecl) why+=`這次同時是${ecl}，情緒與事件的力道會比平常的滿月強。`;
  const sub=`${md(k)}（${wd(k)}）${t}・${nm}${ty} ${deg}${ecl?`・${ecl}`:''}${pastTag(k)}`;
  return cardHTML(isNew?'#b8862b':'#7d6f86',isNew?'●':'○',isNew?'新月許願':'滿月釋放',sub,why,kvHTML(ctx,s,h=>(isNew?NMW:FMW)[h]));
}
function retroItem(r,ctx,first,last){
  const [p,a,b,signs]=r,nm=PL[p][0];
  const inA=a>=first&&a<=last,inB=b>=first&&b<=last;
  const s=inB?signs[signs.length-1]:signs[0];
  const where=signs.length>1?`從${SIGN[signs[0]][0]}退回${SIGN[signs[signs.length-1]][0]}`:`在${SIGN[s][0]}逆行`;
  const tag=inA&&!inB?pastTag(a):inB&&!inA?pastTag(b):(b<todayKey?' · 已結束':'');
  const sub=`${md(a)} ～ ${md(b)}（${wd(b)}）・${nm}${where}${tag}`;
  const st=inB&&!inA?`${md(b)} 恢復順行，已接近尾聲。`:inA&&!inB?`${md(a)} 開始逆行，會持續到 ${md(b)}。`:'';
  return cardHTML('#b8452f','℞',`${nm}逆行`,sub,WHYM[p]+st,kvHTML(ctx,s,h=>RTW[p][h]));
}
function ingItem(k,p,s,ctx){
  const sn=SIGN[s][0],nm=PL[p][0];
  const verb=retroOn(k).some(r=>r[0]===p)?'退回':'進入';
  const sub=`${md(k)}（${wd(k)}）起・${nm}${verb}${sn}${pastTag(k)}`;
  if(p==='sun') return cardHTML('#b8862b','☉','生日季開始',sub,'',`<p class="plain">太陽回到你的星座，能量與關注回到你身上。適合回顧自己這一年、為自己慶祝，也替新的一歲許個願。</p>`);
  return cardHTML(p==='jup'?'#b8862b':'#7a5784',PL[p][1]+V,`${nm}換星座`,sub,WHYM['i'+p],kvHTML(ctx,s,h=>INGW[p][h]));
}

/* ---------- 每月塔羅（偉特塔羅）----------
   key：'YYYY-MM'。沒有填的月份不會顯示塔羅區塊。
   zh／en：牌名；kind：'major'（大阿爾克那）或 'minor'（小阿爾克那）；num：牌號（羅馬數字）；suit：小牌花色（只有小牌需要）
   up：true = 正位、false = 逆位（逆位時牌面會轉 180°）
   txt：牌義說明，一段一行，用 \n 分段；留空會顯示「準備中」的預留框
   img：牌面圖檔路徑（選填，例如 'cards/15-devil.jpg'，需跟頁面一起上傳）；沒有就顯示預留牌面 */
const CARDS={
 '2026-11':{zh:'惡魔',en:'The Devil',kind:'major',num:'XV',up:true,txt:'惡魔是「看見自己被什麼綁住」的牌。鎖鏈其實很鬆，你不是被困住，只是還沒發現自己可以拿下來。\n11/9 天蠍座新月把題目丟給你：我真正想要什麼、我抓著什麼不放。水星與金星逆行（到 11/13、11/14）讓舊人、舊習慣回頭找你，先問自己是真的想回去，還是只是習慣。11/24 雙子座滿月，適合把放不下的話說開，或放掉一個說了很久卻沒改的習慣。',img:''},
 '2026-12':{zh:'權杖十',en:'Ten of Wands',kind:'minor',suit:'權杖',num:'X',up:true,txt:'權杖十是「一個人扛太多」的牌：目標快到了，手上的棍子卻多到看不見前面的路。提醒你不是撐更久，而是看看哪些可以放下、哪些可以請人分擔。\n12/9 射手座新月問你：今年真正想完成的是哪一件？12/11 土星、12/13 海王星回到順行，12/13 木星轉逆行，責任與迷霧慢慢清楚，適合收斂而不是再擴張。12/22 太陽進摩羯座，年底的責任感最重；12/24 巨蟹座滿月，把照顧所有人的重擔先放一放，也照顧自己。',img:''}
};
const escH=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tarotHTML(pre){
  const c=CARDS[pre];
  if(!c) return '';
  const pos=c.up===false?'逆位':'正位',label=`偉特塔羅 ${c.zh}（${pos}）`;
  const face=c.img
    ?`<img src="${escH(c.img)}" alt="${escH(label)}" loading="lazy">`
    :`<div class="tface" aria-hidden="true"><span class="tnum">${escH(c.num)}</span><span class="tsym">✦</span><span class="tzh">${escH(c.zh)}</span></div>`;
  const paras=String(c.txt||'').split('\n').map(x=>x.trim()).filter(Boolean);
  const txt=paras.length?paras.map(x=>`<p class="ttxt">${escH(x)}</p>`).join(''):'<p class="ttxt empty">這個月的牌義說明準備中。</p>';
  return `<section class="tbox" aria-label="本月塔羅"><div class="tcard${c.up===false?' rev':''}" role="img" aria-label="${escH(label)}">${face}</div>
    <div class="tinfo"><div class="tlbl">本月塔羅・偉特塔羅</div><div class="tname"><b>${escH(c.zh)}</b><span class="ten">${escH(c.en)}</span></div><span class="tpos${c.up===false?' rv':''}">${pos}</span><span class="tkind">${c.kind==='minor'?'小阿爾克那・'+escH(c.suit||''):'大阿爾克那・'+escH(c.num)}</span></div><div class="tdesc">${txt}</div></section>`;
}

/* ---------- 單月 ---------- */
function monthHTML(y,m,ctx,i,isNow,isOpen){
  const pre=`${y}-${pad(m+1)}`,first=pre+'-01',last=`${pre}-${pad(new Date(y,m+1,0).getDate())}`;
  const moons=MOONS.filter(x=>x[0].startsWith(pre));
  const retros=RETRO.filter(r=>r[1]<=last&&r[2]>=first);
  const inner=retros.filter(r=>INNER.includes(r[0])),outer=retros.filter(r=>!INNER.includes(r[0]));
  const ings=ING.filter(([k,p,s])=>k.startsWith(pre)&&(p==='ven'||p==='mar'||p==='jup'||(p==='sun'&&s===ctx.sun)));

  // 摘要列：每個新月／滿月一行，同時列出太陽與上升落在哪個領域
  const hl=moons.map(x=>{
    const ty=x[2]==='new'?'新月':'滿月',hs=ctx.views.map(v=>({v,h:house(x[3],v.sign)}));
    const txt=(hs.length>1&&hs[0].h===hs[1].h?[`☉↑ ${HS[hs[0].h].short}`]:hs.map(o=>`${o.v.icon} ${HS[o.h].short}`)).map(s=>`<span class="vt">${s}</span>`).join(' ');
    return `<span class="hline"><b>${ty}</b><span class="hv">${txt}</span></span>`;
  }).join('');
  const tags=[];
  if(CARDS[pre]) tags.push(`<span class="chip tarot">✦ ${escH(CARDS[pre].zh)}${CARDS[pre].up===false?' 逆位':' 正位'}</span>`);
  moons.forEach(x=>{
    const ty=x[2]==='new'?'新月':'滿月';
    if(x[5]) tags.push(`<span class="chip ecl">${x[5].includes('日')?'日食':'月食'}</span>`);
    ctx.views.forEach(v=>{
      const h=house(x[3],v.sign);
      if(h===1) tags.push(`<span class="chip axis">${ty}在你的${v.label}星座</span>`);
      if(h===7) tags.push(`<span class="chip axis">${ty}在你的${v.label}對宮</span>`);
    });
  });
  inner.forEach(r=>tags.push(`<span class="chip retro">℞ ${PL[r[0]][0]}逆行</span>`));
  ings.forEach(([k,p,s])=>{
    if(p==='sun') tags.push('<span class="chip bday">生日季</span>');
    if(p==='jup') tags.push('<span class="chip ingress">木星換座</span>');
  });

  // 展開內容
  let body=tarotHTML(pre);
  const evs=[...moons.map(x=>({k:x[0],h:moonItem(x,ctx)})),...ings.map(([k,p,s])=>({k,h:ingItem(k,p,s,ctx)}))];
  inner.forEach(r=>evs.push({k:r[1]<first?first:r[1],h:retroItem(r,ctx,first,last)}));
  evs.sort((a,b)=>a.k<b.k?-1:a.k>b.k?1:0);
  if(!inner.length) body+='<p class="calm2">這個月水星、金星、火星都在順行，推進計畫、簽約與溝通比較順手。</p>';
  body+=evs.map(e=>e.h).join('');
  if(outer.length){
    body+='<div class="bgline"><span class="lbl">背景：</span>'+outer.map(([p,a,b])=>{
      const inA=a>=first&&a<=last,inB=b>=first&&b<=last;
      const st=inA&&inB?`${md(a)}–${md(b)}`:inA?`${md(a)} 起`:inB?`${md(b)} 順行`:`到 ${md(b)}`;
      return `<span class="chip bg">${PL[p][1]+V} ${PL[p][0]}逆行・${st}</span>`;
    }).join('')+'</div>';
  }

  return `<details class="m dark${isNow?' now':''}"${isOpen?' open':''} style="--i:${i}">
    <summary>
      <span class="ymbox"><span class="y">${y}</span><span class="mo">${m+1} 月</span>${isNow?'<span class="nowtag">本月</span>':''}</span>
      <span><span class="hl">${hl}</span><span class="tags">${tags.join('')}</span></span>
      <span class="chev" aria-hidden="true"></span>
    </summary>
    <div class="mbody">${body}</div>
  </details>`;
}

 ['jup','木星・機會與成長',[['leo','到 2027/7/26・'],['vir','2027/7/26 起・']],'機會、貴人與成長，最容易出現在木星所在的領域。'],
 ['sat','土星・責任與課題',[['ari','']],'需要踏實經營，進展比較慢，但現在打下的基礎會留得很久。'],
 ['ura','天王星・突變與自由',[['gem','']],'容易出現意外的變動，也是你想要更多自由的地方。'],
 ['nep','海王星・模糊與理想',[['ari','']],'容易理想化、界線模糊；重要決定先看清楚事實再下。'],
 ['plu','冥王星・深層轉化',[['aqu','']],'正在經歷長期而深層的重整。']];
function bgHTML(ctx){
  const cards=OUT.map(([p,label,pls])=>{
    const kw=label.split('・')[1],nm=PL[p][0];
    let periods,curSign,curSub;
    if(p==='jup'){
      const before=todayKey<JUP_SWITCH;
      periods=before?[['leo','現在 ～ 2027/7/26・木星在獅子座'],['vir','2027/7/26 起・木星進入處女座']]:[['vir','2027/7/26 起・木星在處女座']];
      curSign=before?'leo':'vir';curSub=before?'7/26 起換到處女座':'2027/7/26 起';
    }else{periods=[[pls[0][0],`${nm}在${SIGN[pls[0][0]][0]}`]];curSign=pls[0][0];curSub='整段期間';}
    const inner=periods.map(([s,lab])=>`<div class="per">${lab}</div>`+kvHTML(ctx,s,h=>BGW[p][h])).join('');
    return `<details class="b2" data-pl="${p}" style="--c:${PCOL[p]}"${bgOpen[p]?' open':''}><summary class="ph"><span class="pg" aria-hidden="true">${PL[p][1]+V}</span><div><div class="pn">${nm}</div><div class="pk">${kw}</div></div><div class="now"><b>在${SIGN[curSign][0]}</b>${curSub}</div><span class="cv" aria-hidden="true"></span></summary><div class="pb"><p class="why">${WHYB[p]}</p>${inner}</div></details>`;
  }).join('');
  return `<section class="panel fade"><h2>這段時間的大背景</h2><p class="sub">這五顆行星走得慢，影響的不是某一天，而是一整年以上的大方向。點開每顆星看它落在你生活的哪裡。</p><div class="bglist">${cards}</div></section>`;
}

/* ---------- 主畫面 ---------- */
let state=null,lockNote=null,bgOpen={jup:true};
function ctxOf(){
  const s=state,views=[{k:'sun',label:'太陽',icon:'☉',sign:s.sun}];
  if(s.asc) views.push({k:'asc',label:'上升',icon:'↑',sign:s.asc});
  return {views,sun:s.sun,asc:s.asc};
}
const HERO={
 sun:{lb:'太陽星座',en:'SUN',meta:'內在的你',kw:['核心個性','在乎的事','人生方向'],ds:'你的核心個性、真正在乎的事，和想活成的樣子。'},
 asc:{lb:'上升星座',en:'ASCENDANT',meta:'外在的你',kw:['第一印象','做事風格','生活領域'],ds:'別人對你的第一印象，和你面對世界、處理日常的方式。'}};
function heroHTML(ctx){
  const s=state,hasAsc=!!s.asc;
  const cards=ctx.views.map(v=>{const H=HERO[v.k];return `<div class="m2 ${v.k}"><div class="band"><div class="lb">${H.lb}<small>${H.en}</small></div></div><div class="gl" aria-hidden="true">${SIGN[v.sign][1]+V}</div>
    <div class="bd"><div class="nm">${SIGN[v.sign][0]}</div><div class="rg">${v.k==='asc'?'依出生時間計算':RANGE[v.sign]}</div><div class="meta">${H.meta}</div>
    <div class="kw">${H.kw.map(x=>`<span>${x}</span>`).join('')}</div><p class="ds">${H.ds}</p></div></div>`;}).join('');
  const notes=[];
  if(s.alt) notes.push(`你的生日在兩個星座的交界，實際是哪一個要看出生年與時間。目前先以<b>${SIGN[s.sun][0]}</b>顯示，<button type="button" class="linkbtn" data-act="alt">改看${SIGN[s.alt][0]}</button>。有出生時間的話，可以回到上方重新填寫。`);
  if(s.ascAlt) notes.push(`你的上升接近兩個星座的交界，出生時間差幾分鐘就可能是另一個。目前以<b>${SIGN[s.asc][0]}</b>上升顯示，<button type="button" class="linkbtn" data-act="altasc">改看${SIGN[s.ascAlt][0]}上升</button>。`);
  if(s.note) notes.push(s.note);
  const colSun='<div class="col"><span class="pill sun">☉ 太陽・看出生日期</span><div class="q">像是你的「心」</div><p class="ex">說明你是什麼樣的人、為什麼而努力，影響比較深、比較長遠。</p></div>';
  const colAsc='<div class="col"><span class="pill asc">↑ 上升・看出生時間</span><div class="q">像是你的「門面」</div><p class="ex">說明你怎麼和世界互動，也決定生活中工作、感情、金錢等領域落在哪裡，事件比較具體、有感。</p></div>';
  const read=hasAsc
    ?`<div class="read"><h3>太陽和上升有什麼不同？</h3><p class="sub2">兩個都是你，只是看的角度不同</p><div class="cols">${colSun}${colAsc}</div>
      <div class="both"><b>怎麼看下面的運勢？</b>兩個視角各給一句建議：上升看<b>實際會發生的事</b>，太陽看<b>內心的感受與課題</b>。如果你的太陽和上升是同一個星座，兩個視角會落在同一個領域，合併成 <span class="pill">☉↑ 重點</span>，代表那段時間特別值得留意。</div></div>`
    :`<div class="read"><h3>太陽和上升有什麼不同？</h3><p class="sub2">兩個都是你，只是看的角度不同</p><div class="cols">${colSun}${colAsc}</div>
      <div class="both"><b>目前只用太陽星座看運勢。</b>上升星座要用出生時間計算；有出生時間的話，可以回到上方重新填寫，就能同時看到兩個視角。</div></div>`;
  return `<section class="panel hero fade" id="hero"><h2>${hasAsc?'你的太陽與上升':'你的太陽星座'}</h2>
    <p class="sub">${hasAsc?`出生 ${s.info.y}/${s.m}/${s.d} ${s.info.time}・${s.info.place}`:`出生月日 ${s.m}/${s.d}`}</p>
    <div class="duo2 ${ctx.views.length===1?'one':''}">${cards}</div>
    ${notes.map(n=>`<div class="cusp">${n}</div>`).join('')}
    ${read}
    <button type="button" class="linkbtn again" data-act="again">換一個生日</button></section>`;
}

const HSHORT=['','自己','金錢','溝通學習','家與內心','戀愛創作','工作健康','伴侶合作','信任轉化','進修遠行','事業目標','朋友願景','休息放下'];
function houseHelp(ctx,ym){
  const pre=ym?`${ym[0]}-${pad(ym[1]+1)}`:'';
  const mo=MOONS.find(x=>x[0].startsWith(pre))||MOONS[0];
  const ex=ctx.views.map(v=>{const h=house(mo[3],v.sign),sun=v.k==='sun';
    return `<span class="k ${v.k}">${sun?'☉ 太陽':'<b>↑ 上升</b>'}<span>第 ${h} 宮</span></span><p>用你的<b>${v.label}星座</b>來數，落在第 ${h} 個領域「${HS[h].short}」→ ${sun?'心裡會在意這一塊':'實際生活會發生在這一塊'}。</p>`;}).join('');
  return `<details class="hx"><summary><span class="q" aria-hidden="true">?</span>${ctx.views.length>1?'太陽／上升':'太陽'}「第 ? 宮」是什麼意思？<span class="cv" aria-hidden="true"></span></summary><div class="in">
    <p>占星把生活分成 <b>12 個領域</b>，叫做「宮位」。每顆星、每次新月滿月，都會落在其中一個領域，告訴你那段時間<b>事情會發生在生活的哪一塊</b>。</p>
    <p class="exl">以 ${md(mo[0])} 的${SIGN[mo[3]][0]}${mo[2]==='new'?'新月':'滿月'}為例：</p><div class="ex">${ex}</div>
    <b>12 個領域對照表</b><div class="grid">${HSHORT.slice(1).map((x,i)=>`<div class="g"><b>第 ${i+1} 宮</b><span>${x}</span></div>`).join('')}</div>
    ${ctx.views.length>1?(ctx.sun===ctx.asc?'<p class="tip">你的太陽和上升是同一個星座，所以兩個視角永遠落在同一宮，會合併成「☉↑ 重點」。</p>':'<p class="tip">同一件星象，太陽和上升會落在不同的宮，因為起算的星座不同，兩個都參考就好。</p>'):''}</div></details>`;
}
function monthsHTML(ctx,openArr){
  const nowKey=`${todayD.getFullYear()}-${pad(todayD.getMonth()+1)}`,key=([y,m])=>`${y}-${pad(m+1)}`;
  let start=MONTHS.findIndex(mo=>key(mo)===nowKey);
  const inRange=start>=0;
  if(!inRange) start=nowKey<key(MONTHS[0])?0:MONTHS.length-1;
  const list=MONTHS.slice(start),openN=Math.max(1,Math.min(unlockedEnd-start+1,list.length)),locked=list.length-openN;
  const legend='<div class="legend" aria-label="圖例"><span class="chip new">● 新月許願</span><span class="chip full">○ 滿月釋放</span><span class="chip retro">℞ 逆行</span><span class="chip ingress">→ 換星座</span></div>'+`<p class="vkey">${ctx.views.map(v=>`<b>${v.icon}</b> ${v.label}星座視角`).join('　')}</p>`;
  const legendHelp=houseHelp(ctx,list[0]);
  const open=list.slice(0,openN).map(([y,mo],i)=>{
    const isNow=inRange&&i===0;
    return monthHTML(y,mo,ctx,i,isNow,openArr?!!openArr[i]:isNow);
  }).join('');
  let lock='';
  if(locked>0){
    lock=`<div class="unlock" id="unlock"><div class="ttl">${LOCK_SVG}<span>還有 ${locked} 個月上鎖中</span></div>
      <p class="hint">輸入你的專屬序號，就能看到序號涵蓋的月份。序號請向 Tequila 索取。</p>
      <form id="unlockf" autocomplete="off"><input type="text" id="serial" placeholder="TQ-XXXX-XXXX" aria-label="序號" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="40"><button type="submit" class="ubtn">解鎖</button></form>
      <p class="um ${lockNote?lockNote.cls:''}" id="lockmsg" role="status">${lockNote?lockNote.text:''}</p></div>`+
      list.slice(openN).map(([y,mo])=>`<button type="button" class="lockrow dark" data-act="focuslock">${LOCK_SVG}<span><span class="y">${y}</span><span class="mo">${mo+1} 月</span></span><span class="st">上鎖中</span></button>`).join('');
  }else if(openN>1){
    lock=`<p class="okline">已解鎖到 ${ymOf(MONTHS.length-1)}，全部月份都可以看</p>`;
  }
  return `<section class="panel months"><h2>每個月要留意的</h2><p class="sub">點開每個月，看新月、滿月與逆行落在你生活的哪個領域。</p>${legend}${legendHelp}<div class="mlist">${open}${lock}</div></section>`;
}
function render(opts={}){
  const ctx=ctxOf(),r=$('#result');
  r.classList.toggle('noanim',opts.anim===false);
  r.innerHTML=`<div style="display:flex;flex-direction:column;gap:22px">${heroHTML(ctx)}${bgHTML(ctx)}${monthsHTML(ctx,opts.open)}</div>`;
}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function show(scroll){
  render();
  if(scroll){const r=$('#result');r.focus({preventScroll:true});r.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});}
}
// 切換或解鎖時保留展開狀態
function rerender(){
  render({anim:false,open:[...document.querySelectorAll('details.m')].map(d=>d.open)});
}

/* ---------- 表單 ---------- */
const bm=$('#bm'),bd=$('#bd'),by=$('#by'),bt=$('#bt'),bp=$('#bp'),bu=$('#bu'),msg=$('#msg');
for(let i=1;i<=12;i++) bm.add(new Option(i+' 月',i));
(function(){
  let grp=null,g='';
  PLACES.forEach((p,i)=>{
    if(p[0]!==g){g=p[0];grp=document.createElement('optgroup');grp.label=g;bp.appendChild(grp);}
    grp.appendChild(new Option(p[1],i));
  });
  bp.add(new Option('其他地方（請私訊我協助）','other'));
})();
by.max=todayD.getFullYear();
function fillDays(){
  const m=+bm.value,cur=bd.value,n=m?DIM[m-1]:31;
  bd.length=1;
  for(let i=1;i<=n;i++) bd.add(new Option(i+' 日',i));
  if(cur&&+cur<=n) bd.value=cur;
}
function warn(t){msg.textContent=t;msg.hidden=false;}
bm.addEventListener('change',fillDays);
bu.addEventListener('change',()=>{by.disabled=bt.disabled=bp.disabled=bu.checked;msg.hidden=true;});
fillDays();

$('#f').addEventListener('submit',e=>{
  e.preventDefault();
  msg.hidden=true;
  const m=+bm.value,d=+bd.value,y=+by.value,t=bt.value;
  if(!m||!d) return warn('請先選擇出生的月份和日期。');
  const st={m,d,sun:signOf(m,d),alt:cusp(m,d),asc:null,ascAlt:null,info:null,note:''};
  if(!bu.checked){
    if(!by.value||!t||!bp.value) return warn('請把出生年、出生時間和出生地都填好；不知道出生時間的話，請勾選「我不知道出生時間」。');
    if(!(y>=1920&&y<=todayD.getFullYear())) return warn('請確認出生年（1920 年之後）。');
    if(m===2&&d===29&&!leap(y)) return warn(`${y} 年沒有 2/29，請確認生日。`);
    if(bp.value==='other'){
      st.note='出生地不在清單內，先以太陽星座顯示。想算上升，歡迎私訊 Tequila 協助。';
    }else{
      const r=computePrecise(y,m,d,t,+bp.value),dg=r.ascDeg;
      st.sun=r.sun;st.alt=null;st.asc=r.asc;
      st.ascAlt=dg<2?Z[(Z.indexOf(r.asc)+11)%12]:dg>28?Z[(Z.indexOf(r.asc)+1)%12]:null;
      st.info={y,time:t,place:PLACES[+bp.value][1]};
    }
  }
  state=st;
  show(true);
});

const R=$('#result');
R.addEventListener('toggle',e=>{const p=e.target.dataset&&e.target.dataset.pl;if(p)bgOpen[p]=e.target.open;},true);
R.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||!state) return;
  const a=b.dataset.act;
  if(a==='alt'){const x=state.alt;state.alt=state.sun;state.sun=x;rerender();}
  if(a==='altasc'){const x=state.ascAlt;state.ascAlt=state.asc;state.asc=x;rerender();}
  if(a==='focuslock'){const u=$('#serial');if(u){u.focus({preventScroll:true});u.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});}}
  if(a==='again'){state=null;bgOpen={jup:true};R.innerHTML='';window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});bm.focus({preventScroll:true});}
});
// 序號解鎖
R.addEventListener('submit',e=>{
  if(e.target.id!=='unlockf') return;
  e.preventDefault();
  const v=$('#serial').value,um=$('#lockmsg');
  if(!v.trim()){um.className='um no';um.textContent='請先輸入序號。';return;}
  const end=endOf(v);
  if(end<0){um.className='um no';um.textContent='序號不正確，請再確認一次，或向 Tequila 索取。';return;}
  const nowI=MONTHS.findIndex(([y,m])=>y===todayD.getFullYear()&&m===todayD.getMonth());
  const cur=nowI>=0?nowI:(todayKey<`${MONTHS[0][0]}-${pad(MONTHS[0][1]+1)}`?0:MONTHS.length-1);
  if(end<cur){um.className='um no';um.textContent=`這組序號只到 ${ymOf(end)}，已經過期了，請向 Tequila 索取新的序號。`;return;}
  if(end===cur){um.className='um no';um.textContent=`這組序號只到 ${ymOf(end)}，也就是當月份，已經可以看了。`;return;}
  if(end>unlockedEnd){unlockedEnd=end;serialCode=canon(v);saveSerial(serialCode);}
  lockNote={cls:'ok',text:`已解鎖到 ${ymOf(unlockedEnd)}`};
  rerender();
  setTimeout(()=>{lockNote=null;},0);
});

/* ---------- 彩蛋：乾一杯 ---------- */
(function(){
  const b=$('#cheers'),tx=$('#ctext'),orig=tx.innerHTML;
  let busy=false;
  function burst(){
    const bb=b.getBoundingClientRect(),sv=b.querySelector('svg').getBoundingClientRect();
    const cx=sv.left-bb.left+sv.width/2,cy=sv.top-bb.top+sv.height*.27;
    for(let i=0;i<18;i++){
      const p=document.createElement('i');p.className='pt';p.style.left=cx+'px';p.style.top=cy+'px';
      b.appendChild(p);
      const a=Math.random()*Math.PI*2,r=34+Math.random()*56;
      p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},
        {transform:`translate(calc(-50% + ${Math.cos(a)*r}px),calc(-50% + ${Math.sin(a)*r-16}px)) scale(.2)`,opacity:0}],
        {duration:700+Math.random()*500,delay:340,easing:'cubic-bezier(.2,.7,.3,1)',fill:'both'}).onfinish=()=>p.remove();
    }
  }
  b.addEventListener('click',()=>{
    if(busy) return;
    busy=true;
    tx.textContent='叮！乾杯！';
    if(!reduce){b.classList.remove('on');void b.offsetWidth;b.classList.add('on');burst();}
    setTimeout(()=>{tx.innerHTML=orig;b.classList.remove('on');busy=false;},reduce?1400:2000);
  });
})();

/* ---------- 品牌輔助圖形：月相與酒痕的不完整圓弧 ---------- */
(function(){
  if(reduce) return;
  const c=$('#sky'),x=c.getContext('2d');let W,H,arcs=[];
  function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
    arcs=Array.from({length:Math.max(12,Math.round(W*H/42000))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*46+22,a:Math.random()*6.28,
      sw:Math.PI*(.9+Math.random()),v:(Math.random()-.5)*.004,w:Math.random()*2.2+.8,p:Math.random()*6.28,dy:Math.random()*.12+.03}));}
  function frame(){
    x.clearRect(0,0,W,H);x.strokeStyle='#eac063';x.lineCap='round';
    for(const s of arcs){s.a+=s.v;s.p+=.008;s.y-=s.dy;if(s.y<-s.r)s.y=H+s.r;
      x.globalAlpha=.07+.1*(.5+.5*Math.sin(s.p));x.lineWidth=s.w;x.beginPath();x.arc(s.x,s.y,s.r,s.a,s.a+s.sw);x.stroke();}
    x.globalAlpha=1;requestAnimationFrame(frame);}
  size();addEventListener('resize',size);frame();
})();
</script>
