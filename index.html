<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>專屬星象月曆｜Tequila</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Tequila 品牌：深紫底、金色標準色、吊燈光束、紙卡面板、月相酒痕圓弧紋。單一深色主題。 */
:root{
  color-scheme:dark;
  --bg:#2d1932; --surface:#3a2340; --ink:#f5ecd9; --muted:#c4b4c8; --line:#5a4260;
  --gold:#eac063; --paper:#f3f1ec; --plum:#2d1932;
  --new:#eac063; --full:#f3f1ec; --retro:#b8452f; --ingress:#7a5784;
  --mark:"UnifrakturMaguntia","Old English Text MT",serif;
  --body:"GenSenRounded TW","jf-openhuninn-2.0","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:28px 16px 112px;display:flex;flex-direction:column;gap:22px}
p{margin:0}
h1{font-size:28px;margin:4px 0 0;letter-spacing:.04em;font-weight:700;line-height:1.3}
.brand{font-family:var(--mark);color:var(--gold);font-size:34px;line-height:1}
.vip{display:inline-block;vertical-align:middle;margin-left:6px;border:1px solid var(--gold);color:var(--gold);border-radius:4px;font-size:12px;letter-spacing:.14em;padding:0 7px;line-height:1.6}
.sub{color:var(--muted);font-size:14px}
header{display:flex;flex-direction:column;gap:6px}
button,select,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#result:focus{outline:none}
.dark{--ink:#f5ecd9;--muted:#c4b4c8;--line:#5a4260;color:var(--ink)}

/* 紙卡面板：所有區塊共用同一款標題 */
.panel{--ink:#2d1932;--muted:#5f4e64;--line:#d8d1c6;color:var(--ink);position:relative;background:var(--paper);border-radius:16px;padding:34px 20px 22px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px;color-scheme:light}
.panel::before,.panel::after{content:"";position:absolute;top:14px;width:10px;height:10px;border-radius:50%;background:#55505a}
.panel::before{left:16px}.panel::after{right:16px}
.panel :focus-visible{outline-color:var(--plum)}
.panel>h2{margin:0;text-align:center;font-size:22px;font-weight:700;line-height:1.35;text-wrap:balance}
.panel>.sub{text-align:center}

/* 生日與出生資料表單 */
label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);min-width:0}
select,input[type=number],input[type=time],input[type=text]{height:44px;font-size:16px;border:1px solid #b9b0a4;border-radius:8px;background:#fff;color:var(--ink);padding:0 10px;min-width:0;width:100%}
.r3{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.r2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:8px}
input[type=time]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;text-align:left}
input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
.chk{flex-direction:row;align-items:center;gap:10px;font-size:14px;color:var(--ink);cursor:pointer;min-height:44px}
.chk input{width:20px;height:20px;flex:none;accent-color:var(--plum)}
.hint{font-size:12.5px;color:var(--muted)}
.go{align-self:center;height:44px;border:0;border-radius:999px;background:var(--plum);color:var(--gold);font-weight:700;letter-spacing:.06em;padding:0 28px;font-size:15px}
.msg{background:#fff;border-left:4px solid var(--retro);border-radius:6px;padding:8px 12px;font-size:14px}

/* 標籤與圖例 */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:1px 8px;font-size:13px;font-weight:500;line-height:1.55;border:1px solid transparent}
.chip.new{background:var(--new);color:var(--plum);font-weight:700}
.chip.full{background:var(--full);color:var(--plum);border-color:rgba(45,25,50,.35)}
.chip.retro{background:var(--retro);color:#fff}
.chip.ingress{background:var(--ingress);color:#fff}
.chip.ecl{background:transparent;border-color:var(--gold);color:var(--gold)}
.chip.bday{background:var(--gold);color:var(--plum);font-weight:700}
.chip.axis{background:transparent;border-color:var(--line);color:var(--ink)}
.chip.bg{background:transparent;border-color:var(--line);color:var(--ink)}
/* 每月塔羅牌 */
.chip.tarot{background:rgba(234,192,99,.14);border-color:rgba(234,192,99,.55);color:var(--gold)}
.tbox{display:grid;grid-template-columns:104px 1fr;grid-template-rows:auto 1fr;gap:6px 16px;align-items:start;padding:14px 0 16px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.tcard{position:relative;width:104px;aspect-ratio:2/3;border-radius:7px;background:var(--plum);box-shadow:0 4px 12px rgba(45,25,50,.28);overflow:hidden}
.tcard img{display:block;width:100%;height:100%;object-fit:cover}
.tface{position:absolute;inset:5px;border:1px solid var(--gold);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7px 4px 8px;color:var(--gold);text-align:center}
.tface .tnum{font-family:var(--mark);font-size:19px;line-height:1.1}
.tface .tsym{font-size:30px;line-height:1;opacity:.9}
.tface .tzh{font-size:13px;font-weight:700;letter-spacing:.08em;line-height:1.3}
.tcard.rev img,.tcard.rev .tface{transform:rotate(180deg)}
.tinfo{min-width:0}
.tlbl{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.1em}
.tname{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin-top:2px}
.tname b{font-size:21px;line-height:1.35}
.tname .ten{font-size:13.5px;color:var(--muted)}
.tpos{display:inline-block;margin-top:6px;border-radius:4px;padding:0 8px;font-size:13px;font-weight:700;line-height:1.6;background:var(--plum);color:var(--gold)}
.tkind{margin-left:8px;font-size:13px;color:var(--muted)}
.tpos.rv{background:transparent;border:1px solid var(--plum);color:var(--plum)}
.tdesc{grid-column:2;min-width:0}
.tbox>.tcard{grid-row:span 2}
.ttxt{margin-top:10px;font-size:14.5px;max-width:62ch}
.ttxt+.ttxt{margin-top:6px}
.ttxt.empty{text-wrap:balance;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 8px;justify-content:center}
.vkey{text-align:center;font-size:13.5px;color:var(--muted);margin-top:-2px}
.vkey b{color:var(--plum);font-size:15px}

/* 星座卡 */
.hero{align-items:stretch}
.duo{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:10px;justify-content:center}
.duo.one{grid-template-columns:minmax(0,220px)}
.mini{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.mini .lbl{font-size:13px;color:var(--muted)}
.mini .g{font-size:40px;line-height:1.15;color:var(--plum)}
.mini b{display:block;font-size:18px}
.mini .rng{font-size:12.5px;color:var(--muted)}
.hero .how{font-size:14px;color:var(--muted);text-align:left;max-width:58ch;margin:0 auto}
.cusp{background:#fff;border:1px dashed #b9b0a4;border-radius:10px;padding:10px 12px;font-size:14px;text-align:left}
.linkbtn{background:none;border:0;color:var(--plum);text-decoration:underline;text-underline-offset:3px;padding:6px 4px;font-size:14px}
.hero .linkbtn.again{align-self:center;color:var(--muted);min-height:44px;padding:6px 14px}

/* 太陽／上升並列 */
.vl{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:baseline;margin:6px 0}
.vl1{margin:6px 0}
.vtag{font-size:12px;font-weight:700;border:1px solid var(--plum);color:var(--plum);border-radius:4px;padding:0 6px;white-space:nowrap}
.hot{display:inline-block;margin-top:2px;font-style:normal;font-weight:700;color:var(--plum);background:rgba(234,192,99,.35);border-radius:4px;padding:0 6px;font-size:13px}

/* 全年背景 */
.bgrow{display:grid;grid-template-columns:104px 1fr;gap:4px 14px;padding:12px 0;border-top:1px solid var(--line)}
.bgrow:first-of-type{border-top:0}
.bgd>summary{list-style:none;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700;font-size:15px;cursor:pointer}
.bgd>summary::-webkit-details-marker{display:none}
.bgd>summary .c,.bgd[open]>summary .o{display:none}
.bgd[open]>summary .c{display:inline}
.bgd[open]>summary{margin-bottom:6px}
.bgd>summary .ar{font-size:12px}
.bgrow .what{font-weight:700}
.bgrow .note{font-size:14.5px}
.bgrow .note b{font-weight:700}

/* 月份 */
.mlist{display:flex;flex-direction:column;gap:10px}
details.m{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;animation:fadein .45s ease both;animation-delay:calc(var(--i)*35ms)}
details.m.now{border-left:4px solid var(--gold)}
details.m>summary{list-style:none;display:grid;grid-template-columns:62px 1fr 16px;gap:12px;align-items:start;padding:14px;cursor:pointer}
details.m>summary::-webkit-details-marker{display:none}
.ymbox .y{display:block;font-size:12px;color:var(--muted);line-height:1.2}
.ymbox .mo{display:block;font-size:24px;font-weight:700;color:var(--gold);line-height:1.2;font-variant-numeric:tabular-nums}
.ymbox .nowtag{display:inline-block;margin-top:4px;font-size:11.5px;background:var(--gold);color:var(--plum);border-radius:4px;padding:0 6px;font-weight:700}
.hl{display:block;font-weight:500;font-size:14.5px}
.hline{display:flex;gap:8px;align-items:baseline;white-space:nowrap}
.hline b{flex:none;color:var(--gold)}
.hline .hv{min-width:0}
.vt{display:inline-block;white-space:nowrap;margin-right:10px}
.vt:last-child{margin-right:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:8px;transition:transform .2s}
details[open] .chev{transform:rotate(-135deg);margin-top:12px}
.mbody{--ink:#2d1932;--muted:#5f4e64;--line:#d8d1c6;color:var(--ink);background:var(--paper);padding:6px 16px 18px}
.mbody :focus-visible{outline-color:var(--plum)}
.sec{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.1em;margin:16px 0 2px}
.sec:first-child{margin-top:10px}
.ev{display:grid;grid-template-columns:92px 1fr;gap:4px 14px;padding:10px 0;border-top:1px solid var(--line)}
.sec+.ev{border-top:0}
.ev .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13.5px}
.ev .what{font-weight:700}
.ev .note{grid-column:2;max-width:62ch;font-size:14.5px}
.ev .note em{font-style:normal;color:var(--muted)}
.ev .note em.hot{color:var(--plum)}
.ev .note p+p{margin-top:4px}
.calm{font-size:14.5px;padding:8px 0}
.bgline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.bgline .lbl{font-size:13px;color:var(--muted)}

/* 上鎖 */
.lockrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;background:var(--surface);border:1px dashed #6d5273;border-radius:12px;font-weight:500}
.lockrow svg{flex:none;color:var(--gold)}
.lockrow .mo{color:var(--gold);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.lockrow .y{font-size:12px;color:var(--muted);margin-right:6px}
.lockrow .st{margin-left:auto;color:var(--muted);font-size:13px}
.unlock{background:#fff;border:1.5px solid var(--plum);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.unlock .ttl{display:flex;gap:8px;align-items:center;font-weight:700}
.unlock form{display:flex;gap:8px}
.unlock input{flex:1}
.unlock .ubtn{height:44px;padding:0 20px;border:0;border-radius:8px;background:var(--plum);color:var(--gold);font-weight:700}
.unlock .um{font-size:14px}
.unlock .um:empty{display:none}
.unlock .um.ok{color:#1d6b3a;font-weight:700}
.unlock .um.no{color:var(--retro);font-weight:700}
.okline{font-size:14px;font-weight:700;text-align:center;color:#1d6b3a}

/* 彩蛋與頁尾 */
.cheers{position:relative;align-self:center;background:none;border:0;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 16px;text-align:center;font-size:15px;line-height:1.5;letter-spacing:.06em}
.cheers .glasses{width:132px;height:auto;overflow:visible}
.cheers:not(.on) .glasses{animation:sway 4s ease-in-out infinite}
.gl{transform-box:fill-box;transform-origin:50% 100%}
.cheers.on .gl{animation:clink 1.1s cubic-bezier(.3,.7,.3,1)}
.spark{transform-box:fill-box;transform-origin:50% 50%;opacity:0}
.cheers.on .spark{animation:spark .9s .36s ease-out both}
.ding{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-family:var(--mark);font-size:26px;color:var(--gold);opacity:0;pointer-events:none}
.cheers.on .ding{animation:ding 1.1s .34s ease-out both}
.pt{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold);pointer-events:none}
@keyframes sway{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes clink{0%{transform:none}35%{transform:translate(12px,-4px) rotate(14deg)}48%{transform:translate(8px,-2px) rotate(8deg)}60%{transform:translate(12px,-4px) rotate(13deg)}100%{transform:none}}
@keyframes spark{0%{opacity:0;transform:scale(.2)}30%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(1.8) rotate(45deg)}}
@keyframes ding{0%{opacity:0;transform:translate(-50%,6px)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-18px)}}
.sign{text-align:center;font-family:var(--mark);color:var(--gold);font-size:26px}
#ctext{display:block;min-height:3em}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(45,25,50,.94);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dockin{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;gap:10px}
.dbtn{flex:1;min-height:50px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:10px;font-weight:700;font-size:15.5px;letter-spacing:.04em;text-decoration:none;line-height:1.3}
.dbtn.line{background:var(--gold);color:var(--plum)}
.dbtn.ig{border:1.5px solid var(--gold);color:var(--gold);background:transparent}

/* 動態 */
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
body::before{content:"";position:fixed;top:0;left:50%;width:150vw;height:100vh;transform:translateX(-50%);z-index:0;pointer-events:none;
  background:linear-gradient(rgba(234,192,99,.24),rgba(234,192,99,0) 80%);clip-path:polygon(50% 0,100% 100%,0 100%);animation:lamp 5s ease-in-out infinite}
@keyframes lamp{0%,100%{opacity:1}45%{opacity:.82}50%{opacity:.95}55%{opacity:.8}}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{animation:fadein .45s ease both}
.noanim .fade,.noanim details.m{animation:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}#sky{display:none}}

@media (max-width:560px){
  h1{font-size:24px}
  .ev{grid-template-columns:1fr}.ev .note{grid-column:1}
  .bgrow{grid-template-columns:1fr}
  details.m>summary{grid-template-columns:54px 1fr 14px;gap:10px;padding:12px}
  .ymbox .mo{font-size:22px}
  .hl{font-size:13.5px}.hline{gap:6px}.vt{margin-right:7px}
  .tbox{grid-template-columns:86px 1fr;gap:6px 14px}
  .tdesc{grid-column:1/-1}
  .tbox>.tcard{grid-row:auto}
  .tcard{width:86px}
  .tface .tnum{font-size:16px}.tface .tsym{font-size:24px}.tface .tzh{font-size:12px}
  .tname b{font-size:19px}
  .dbtn{font-size:15px}
  .panel{padding:34px 16px 20px}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main>
<header>
  <div class="brand">Tequila</div>
  <h1>專屬星象月曆<span class="vip">VIP</span></h1>
  <p class="sub">輸入生日與出生時間，太陽與上升星座一起看，每個月要留意的星象。日期與時間皆為台灣時間。</p>
</header>

<form id="f" class="panel" autocomplete="off" novalidate>
  <h2>輸入你的生日</h2>
  <p class="sub">生日與出生時間只在你的裝置上計算，不會被送出或儲存。</p>
  <div class="r3">
    <label>出生年<input id="by" type="number" inputmode="numeric" min="1920" placeholder="西元年"></label>
    <label>月<select id="bm"><option value="">月</option></select></label>
    <label>日<select id="bd"><option value="">日</option></select></label>
  </div>
  <div class="r2">
    <label>出生時間<input id="bt" type="time"></label>
    <label>出生地<select id="bp"><option value="">請選擇</option></select></label>
  </div>
  <p class="hint">上升星座大約每 2 小時就換一個，請盡量用出生證明或母子手冊上的時間；夏令時間會自動換算。</p>
  <label class="chk"><input type="checkbox" id="bu">我不知道出生時間（只看太陽星座）</label>
  <p class="msg" id="msg" role="alert" hidden></p>
  <button type="submit" class="go" id="go">看我的運勢</button>
</form>

<div id="result" tabindex="-1"></div>

<button type="button" class="cheers" id="cheers" aria-label="乾杯">
  <span class="ding" aria-hidden="true">叮！</span>
  <svg class="glasses" viewBox="0 0 120 72" aria-hidden="true">
    <defs>
      <g id="shot">
        <path d="M15.2 26H42.8L39 58Q38.6 62 34.6 62H23.4Q19.4 62 19 58Z" fill="#eac063" fill-opacity=".9"/>
        <path d="M14 14H44L39 58Q38.6 62 34.6 62H23.4Q19.4 62 19 58Z" fill="rgba(245,236,217,.08)" stroke="#f5ecd9" stroke-width="2" stroke-linejoin="round"/>
      </g>
    </defs>
    <g><g class="gl"><use href="#shot"/></g></g>
    <g transform="translate(120 0) scale(-1 1)"><g class="gl"><use href="#shot"/></g></g>
    <path class="spark" d="M60 6 62.6 17.4 74 20 62.6 22.6 60 34 57.4 22.6 46 20 57.4 17.4Z" fill="#eac063"/>
  </svg>
  <span id="ctext">希望每月都能為酒友你服務<br>乾一杯</span>
</button>

<div class="sign">Tequila</div>
</main>

<nav class="dock" aria-label="聯絡 Tequila">
  <div class="dockin">
    <a class="dbtn line" href="https://lin.ee/StcUFOO" target="_blank" rel="noopener">LINE 預約塔羅</a>
    <a class="dbtn ig" href="https://ig.me/m/tarot_tequila" target="_blank" rel="noopener">IG 私訊 Tequila</a>
  </div>
</nav>

<script>
const $=s=>document.querySelector(s);
const V='︎';
const pad=n=>String(n).padStart(2,'0');
const md=k=>`${+k.slice(5,7)}/${+k.slice(8)}`;
const WD=['日','一','二','三','四','五','六'];
const wd=k=>WD[new Date(k+'T00:00:00Z').getUTCDay()];
const uniq=a=>[...new Set(a)];

      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    a0=(a0+a)|0;b0=(b0+b)|0;c0=(c0+c)|0;d0=(d0+d)|0;e0=(e0+e)|0;f0=(f0+f)|0;g0=(g0+g)|0;h0=(h0+h)|0;
  }
  return [a0,b0,c0,d0,e0,f0,g0,h0].map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
function canon(s){
  let c=String(s).normalize('NFKC').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length===8) c='TQ'+c;           // 允許省略開頭的 TQ-

}
function hashCode(c){let h=sha256(SALT+c);for(let i=0;i<ROUNDS;i++)h=sha256(h+c);return h;}
// 回傳到期月份索引；序號不存在回傳 -1
function endOf(s){
  const c=canon(s);
  if(c.length!==10||c.slice(0,2)!=='TQ') return -1;
  const h=hashCode(c),t=TIERS.find(x=>x[0]===h);
  return t?Math.min(t[1],MONTH_COUNT-1):-1;
}

    lock=`<p class="okline">已解鎖到 ${ymOf(MONTHS.length-1)}，全部月份都可以看</p>`;
  }
  return `<section class="panel months"><h2>每個月要留意的</h2><p class="sub">點開每個月，看新月、滿月與逆行落在你生活的哪個領域。</p>${legend}<div class="mlist">${open}${lock}</div></section>`;
}
function render(opts={}){
  const ctx=ctxOf(),r=$('#result');
  r.classList.toggle('noanim',opts.anim===false);
  r.innerHTML=`<div style="display:flex;flex-direction:column;gap:22px">${heroHTML(ctx)}${bgHTML(ctx)}${monthsHTML(ctx,opts.open)}</div>`;
}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function show(scroll){
  render();
  if(scroll){const r=$('#result');r.focus({preventScroll:true});r.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});}
}
// 切換或解鎖時保留展開狀態
function rerender(){
  render({anim:false,open:[...document.querySelectorAll('details.m')].map(d=>d.open)});
}

/* ---------- 表單 ---------- */
const bm=$('#bm'),bd=$('#bd'),by=$('#by'),bt=$('#bt'),bp=$('#bp'),bu=$('#bu'),msg=$('#msg');
for(let i=1;i<=12;i++) bm.add(new Option(i+' 月',i));
(function(){
  let grp=null,g='';
  PLACES.forEach((p,i)=>{
    if(p[0]!==g){g=p[0];grp=document.createElement('optgroup');grp.label=g;bp.appendChild(grp);}
    grp.appendChild(new Option(p[1],i));
  });
  bp.add(new Option('其他地方（請私訊我協助）','other'));
})();
by.max=todayD.getFullYear();
function fillDays(){
  const m=+bm.value,cur=bd.value,n=m?DIM[m-1]:31;
  bd.length=1;
  for(let i=1;i<=n;i++) bd.add(new Option(i+' 日',i));
  if(cur&&+cur<=n) bd.value=cur;
}
function warn(t){msg.textContent=t;msg.hidden=false;}
bm.addEventListener('change',fillDays);
bu.addEventListener('change',()=>{by.disabled=bt.disabled=bp.disabled=bu.checked;msg.hidden=true;});
fillDays();

$('#f').addEventListener('submit',e=>{
  e.preventDefault();
  msg.hidden=true;
  const m=+bm.value,d=+bd.value,y=+by.value,t=bt.value;
  if(!m||!d) return warn('請先選擇出生的月份和日期。');
  const st={m,d,sun:signOf(m,d),alt:cusp(m,d),asc:null,ascAlt:null,info:null,note:''};
  if(!bu.checked){
    if(!by.value||!t||!bp.value) return warn('請把出生年、出生時間和出生地都填好；不知道出生時間的話，請勾選「我不知道出生時間」。');
    if(!(y>=1920&&y<=todayD.getFullYear())) return warn('請確認出生年（1920 年之後）。');
    if(m===2&&d===29&&!leap(y)) return warn(`${y} 年沒有 2/29，請確認生日。`);
    if(bp.value==='other'){
      st.note='出生地不在清單內，先以太陽星座顯示。想算上升，歡迎私訊 Tequila 協助。';
    }else{
      const r=computePrecise(y,m,d,t,+bp.value),dg=r.ascDeg;
      st.sun=r.sun;st.alt=null;st.asc=r.asc;
      st.ascAlt=dg<2?Z[(Z.indexOf(r.asc)+11)%12]:dg>28?Z[(Z.indexOf(r.asc)+1)%12]:null;
      st.info={y,time:t,place:PLACES[+bp.value][1]};
    }
  }
  state=st;
  show(true);
});

const R=$('#result');
R.addEventListener('toggle',e=>{if(e.target.id==='bgd')bgOpen=e.target.open;},true);
R.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||!state) return;
  const a=b.dataset.act;
  if(a==='alt'){const x=state.alt;state.alt=state.sun;state.sun=x;rerender();}
  if(a==='altasc'){const x=state.ascAlt;state.ascAlt=state.asc;state.asc=x;rerender();}
  if(a==='focuslock'){const u=$('#serial');if(u){u.focus({preventScroll:true});u.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});}}
  if(a==='again'){state=null;bgOpen=false;R.innerHTML='';window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});bm.focus({preventScroll:true});}
});
// 序號解鎖
R.addEventListener('submit',e=>{
  if(e.target.id!=='unlockf') return;
  e.preventDefault();
  const v=$('#serial').value,um=$('#lockmsg');
  if(!v.trim()){um.className='um no';um.textContent='請先輸入序號。';return;}
  const end=endOf(v);
  if(end<0){um.className='um no';um.textContent='序號不正確，請再確認一次，或向 Tequila 索取。';return;}
  const nowI=MONTHS.findIndex(([y,m])=>y===todayD.getFullYear()&&m===todayD.getMonth());
  const cur=nowI>=0?nowI:(todayKey<`${MONTHS[0][0]}-${pad(MONTHS[0][1]+1)}`?0:MONTHS.length-1);
  if(end<cur){um.className='um no';um.textContent=`這組序號只到 ${ymOf(end)}，已經過期了，請向 Tequila 索取新的序號。`;return;}
  if(end===cur){um.className='um no';um.textContent=`這組序號只到 ${ymOf(end)}，也就是當月份，已經可以看了。`;return;}
  if(end>unlockedEnd){unlockedEnd=end;serialCode=canon(v);saveSerial(serialCode);}
  lockNote={cls:'ok',text:`已解鎖到 ${ymOf(unlockedEnd)}`};
  rerender();
  setTimeout(()=>{lockNote=null;},0);
});

/* ---------- 彩蛋：乾一杯 ---------- */
(function(){
  const b=$('#cheers'),tx=$('#ctext'),orig=tx.innerHTML;
  let busy=false;
  function burst(){
    const bb=b.getBoundingClientRect(),sv=b.querySelector('svg').getBoundingClientRect();
    const cx=sv.left-bb.left+sv.width/2,cy=sv.top-bb.top+sv.height*.27;
    for(let i=0;i<18;i++){
      const p=document.createElement('i');p.className='pt';p.style.left=cx+'px';p.style.top=cy+'px';
      b.appendChild(p);
      const a=Math.random()*Math.PI*2,r=34+Math.random()*56;
      p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},
        {transform:`translate(calc(-50% + ${Math.cos(a)*r}px),calc(-50% + ${Math.sin(a)*r-16}px)) scale(.2)`,opacity:0}],
        {duration:700+Math.random()*500,delay:340,easing:'cubic-bezier(.2,.7,.3,1)',fill:'both'}).onfinish=()=>p.remove();
    }
  }
  b.addEventListener('click',()=>{
    if(busy) return;
    busy=true;
    tx.textContent='叮！乾杯！';
    if(!reduce){b.classList.remove('on');void b.offsetWidth;b.classList.add('on');burst();}
    setTimeout(()=>{tx.innerHTML=orig;b.classList.remove('on');busy=false;},reduce?1400:2000);
  });
})();

/* ---------- 品牌輔助圖形：月相與酒痕的不完整圓弧 ---------- */
(function(){
  if(reduce) return;
  const c=$('#sky'),x=c.getContext('2d');let W,H,arcs=[];
  function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
    arcs=Array.from({length:Math.max(12,Math.round(W*H/42000))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*46+22,a:Math.random()*6.28,
      sw:Math.PI*(.9+Math.random()),v:(Math.random()-.5)*.004,w:Math.random()*2.2+.8,p:Math.random()*6.28,dy:Math.random()*.12+.03}));}
  function frame(){
    x.clearRect(0,0,W,H);x.strokeStyle='#eac063';x.lineCap='round';
    for(const s of arcs){s.a+=s.v;s.p+=.008;s.y-=s.dy;if(s.y<-s.r)s.y=H+s.r;
      x.globalAlpha=.07+.1*(.5+.5*Math.sin(s.p));x.lineWidth=s.w;x.beginPath();x.arc(s.x,s.y,s.r,s.a,s.a+s.sw);x.stroke();}
    x.globalAlpha=1;requestAnimationFrame(frame);}
  size();addEventListener('resize',size);frame();
})();
</script>
